<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page com Parallax</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <header class="hero-parallax">
        <div class="parallax-fundo camada" data-speed="0.15"></div>
        <div class="parallax-circulo camada" data-speed="0.8"></div>
        <div class="hero-content camada" data-speed="0.4">
            <h1>Landing page com Parallax</h1>
            <p>Experiência visual com múltiplas camadas</p>
        </div>
    </header>

    <main>
        <section style="height: 120vh; padding: 4rem 2rem; background: #1e293b;">
            <h2>Conteúdo Principal</h2>
            <p>Role a página para cima e para baixo para sentir a inércia e a física do scroll.</p>
        </section>
    </main>

    <footer>
        <p style="padding: 2rem; text-align: center;">&copy; 2026 - Todos os direitos reservados</p>
    </footer>
</body>
</html>
